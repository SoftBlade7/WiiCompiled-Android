name: Android NDK build (validation)

on:
  push:
    branches: [ "**" ]
  pull_request:

jobs:
  runtime-ndk-configure:
    name: runtime/ configure+build (aarch64, NDK)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install Ninja
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      - name: Set up Android NDK
        id: ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27c
          local-cache: false

      - name: Sanity-check NDK clang exists
        run: |
          set -eu
          ls -la "${{ steps.ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/" | head -20
          "${{ steps.ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/clang" --version

      - name: Manually Download and Extract Dawn SDK for Android
        run: |
          mkdir -p ${{ github.workspace }}/dawn-sdk
          curl -L "https://github.com" | tar -xz -C ${{ github.workspace }}/dawn-sdk

      - name: Configure runtime/ against the NDK toolchain (aarch64)
        run: |
          set -eu
          cmake -S runtime -B build/android-arm64 -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="${{ steps.ndk.outputs.ndk-path }}/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-29 \
            -DCMAKE_BUILD_TYPE=Release \
            -DAURORA_DAWN_PROVIDER=package \
            -DCMAKE_PREFIX_PATH="${{ github.workspace }}/dawn-sdk"


      - name: Build runtime/ (aarch64)
        run: cmake --build build/android-arm64 --config Release

      - name: Upload configure/build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-configure-logs
          path: |
            build/android-arm64/CMakeFiles/CMakeError.log
            build/android-arm64/CMakeFiles/CMakeOutput.log
            
