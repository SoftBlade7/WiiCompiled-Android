name: Android NDK build (validation)

on:
  push:
    branches: [ "**" ]
  pull_request:
  workflow_dispatch:

jobs:
  runtime-ndk-configure:
    name: runtime/ configure+build (aarch64, NDK)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          submodules: recursive # Fetches dawn and internal dependencies cleanly

      - name: Install Ninja
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      - name: Set up Android NDK
        id: ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27c
          local-cache: true

      - name: Configure runtime/ against the NDK toolchain (aarch64)
        run: |
          set -eu
          # Injected a safe dummy cmake generation target folder to satisfy line 257 if building blank
          mkdir -p generated/build_shards
          echo "" > generated/build_shards/shards.cmake

          cmake -S runtime -B build/android-arm64 -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="${{ steps.ndk.outputs.ndk-path }}/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-29 \
            -DCMAKE_BUILD_TYPE=Release \
            -DAURORA_DAWN_PROVIDER=package \
            -DBUILD_SHARED_LIBS=ON

      - name: Build runtime/ (aarch64)
        run: cmake --build build/android-arm64 --config Release

      - name: Upload configure/build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-configure-logs
          path: |
            build/android-arm64/CMakeFiles/CMakeError.log
            build/android-arm64/CMakeFiles/CMakeOutput.log

  abi-proof-ndk:
    name: statefree_regcall_sret_proof (aarch64, NDK, no game data)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Android NDK
        id: ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27c
          local-cache: true

      - name: Install qemu-user for running the cross-compiled aarch64 binary
        run: sudo apt-get update && sudo apt-get install -y qemu-user

      - name: Compile the ABI proof fixture for aarch64-linux-android
        run: |
          set -eu
          # Use the clean cross-compiler binary provided by the r27c cache
          clang="${{ steps.ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android29-clang++"
          
          # Injected MSVC layout compiler adjustments
          cat > declspec_shim.h <<'EOF'
          #pragma once
          #if !defined(_WIN64)
          #define __declspec(x) __attribute__((x))
          #endif
          EOF
          
          # Dynamic compile target (Dropped -static to align with Bionic libc cross-compiler guidelines)
          "$clang" -std=c++17 -O2 \
            -include declspec_shim.h \
            -o abi_proof \
            translator/tests/fixtures/statefree_regcall_sret_proof.cpp
          file abi_proof

      - name: Run the ABI proof fixture under qemu-aarch64
        run: |
          set -eu
          # Explicitly target the NDK's architecture system root directory for loading dependencies dynamically
          sysroot="${{ steps.ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/sysroot"
          qemu-aarch64 -L "$sysroot" ./abi_proof
          
