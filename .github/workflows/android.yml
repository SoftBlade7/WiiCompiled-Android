name: Android NDK build (validation)

on:
  push:
    branches: [ "**" ]
  pull_request:
  workflow_dispatch:

jobs:
  runtime-ndk-configure:
    name: runtime/ configure+build (aarch64, NDK)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          submodules: recursive

      - name: Install Ninja
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      - name: Set up Android NDK
        id: ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27c
          local-cache: false

      - name: Configure runtime/ against the NDK toolchain (aarch64)
        run: |
          set -eu
          
          # Recreate the generated shards folder structure
          mkdir -p generated/build_shards

          # Inject a mock compilation unit definition to satisfy lines 140+ of PublicProducts.cmake
          cat > generated/build_shards/shards.cmake <<'EOF'
          set(WIICOMPILED_BASE_SHARDS "mock_shard")
          add_library(mock_shard OBJECT)
          target_compile_definitions(mock_shard PRIVATE MOCK_STUB=1)
          EOF
          
          # Wipe cached directories to eliminate any sticky parameters
          rm -rf build/android-arm64

          # Configure the target with exact flags
          cmake -S runtime -B build/android-arm64 -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="${{ steps.ndk.outputs.ndk-path }}/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-29 \
            -DCMAKE_BUILD_TYPE=Release \
            -DAURORA_DAWN_PROVIDER=package \
            -DBUILD_SHARED_LIBS=ON

      - name: Build runtime/ (aarch64)
        run: cmake --build build/android-arm64 --config Release

      - name: Upload configure/build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-configure-logs
          path: |
            build/android-arm64/CMakeFiles/CMakeError.log
            build/android-arm64/CMakeFiles/CMakeOutput.log

  abi-proof-ndk:
    name: statefree_regcall_sret_proof (aarch64, NDK, no game data)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Android NDK
        id: ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27c
          local-cache: false

      - name: Install qemu-user for running the cross-compiled aarch64 binary
        run: sudo apt-get update && sudo apt-get install -y qemu-user

      - name: Compile the ABI proof fixture for aarch64-linux-android
        run: |
          set -eu
          ndk_path="${{ steps.ndk.outputs.ndk-path }}"
          clang="$ndk_path/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android29-clang++"
          sysroot="$ndk_path/toolchains/llvm/prebuilt/linux-x86_64/sysroot"
          
          cat > declspec_shim.h <<'EOF'
          #pragma once
          #if !defined(_WIN64)
          #define __declspec(x) __attribute__((x))
          #endif
          EOF
          
          # Compile dynamically while adapting dynamic link paths for the target layout
          "$clang" -std=c++17 -O2 \
            -include declspec_shim.h \
            -static-libstdc++ \
            -Wl,-dynamic-linker=/lib/ld-android.so \
            -o abi_proof \
            translator/tests/fixtures/statefree_regcall_sret_proof.cpp
          
          # Fix the layout so QEMU can locate native Android loader binaries inside sysroot
          mkdir -p "$sysroot/system/bin"
          ln -s "$sysroot/usr/lib/aarch64-linux-android/29/linker64" "$sysroot/system/bin/linker64"

      - name: Run the ABI proof fixture under qemu-aarch64
        run: |
          set -eu
          sysroot="${{ steps.ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/sysroot"
          
          # Pass systemic library environment overrides directly to QEMU-user
          QEMU_LD_PREFIX="$sysroot" qemu-aarch64 ./abi_proof
          
