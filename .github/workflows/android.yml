name: Android NDK build (validation)

on:
  push:
    branches: [ "**" ]
  pull_request:
  workflow_dispatch:

jobs:
  runtime-ndk-configure:
    name: runtime/ configure+build (aarch64, NDK)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install Ninja
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      - name: Set up Android NDK
        id: ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27c
          local-cache: false

      - name: Sanity-check NDK clang exists
        run: |
          set -eu
          ls -la "${{ steps.ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/" | head -20
          "${{ steps.ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/clang" --version

      - name: Check for translator-generated shard manifest
        run: |
          set -eu
          if [ ! -f "generated/build_shards/shards.cmake" ]; then
            echo "::error::generated/build_shards/shards.cmake is missing. Run Translator.Cli emit-build-shards locally against your own disc dump, then commit the generated/ output to this fork before this job can build the actual game runtime."
            exit 1
          fi
          echo "Found generated/build_shards/shards.cmake - proceeding with a real runtime build."

      # Translator.Cli always writes shards.cmake with the emitting machine's
      # absolute paths baked in (see CMakePath() in TranslatedBuildShardEmitter.cs) -
      # it has no relative-path mode. Rewrite the Windows prefix from local
      # translation to this runner's actual checkout path before configuring.
      - name: Rewrite absolute paths in shards.cmake for this runner
        run: |
          set -eu
          shards="generated/build_shards/shards.cmake"
          before=$(grep -c "C:/Users/SoftBlade/Desktop/wiicompiled/compiled/BuildWorkspace/generated" "$shards" || true)
          echo "Occurrences of the local Windows prefix before rewrite: $before"
          sed -i "s#C:/Users/SoftBlade/Desktop/wiicompiled/compiled/BuildWorkspace/generated#${GITHUB_WORKSPACE}/generated#g" "$shards"
          after=$(grep -c "C:/Users/SoftBlade/Desktop/wiicompiled/compiled/BuildWorkspace/generated" "$shards" || true)
          echo "Occurrences remaining after rewrite: $after"
          if [ "$after" -ne 0 ]; then
            echo "::error::Rewrite left $after unmatched occurrences - check for other path variants in shards.cmake."
            exit 1
          fi

      # Translator.Cli always writes shards.cmake with the emitting machine's
      # absolute paths baked in (see CMakePath() in TranslatedBuildShardEmitter.cs) -
      # it has no relative-path mode. Rewrite the Windows prefix from local
      # translation to this runner's actual checkout path before configuring.
      - name: Rewrite absolute paths in shards.cmake for this runner
        run: |
          set -eu
          shards="generated/build_shards/shards.cmake"
          before=$(grep -c "C:/Users/SoftBlade/Desktop/wiicompiled/compiled/BuildWorkspace/generated" "$shards" || true)
          echo "Occurrences of the local Windows prefix before rewrite: $before"
          sed -i "s#C:/Users/SoftBlade/Desktop/wiicompiled/compiled/BuildWorkspace/generated#${GITHUB_WORKSPACE}/generated#g" "$shards"
          after=$(grep -c "C:/Users/SoftBlade/Desktop/wiicompiled/compiled/BuildWorkspace/generated" "$shards" || true)
          echo "Occurrences remaining after rewrite: $after"
          if [ "$after" -ne 0 ]; then
            echo "::error::Rewrite left $after unmatched occurrences - check for other path variants in shards.cmake."
            exit 1
          fi

      - name: Configure runtime/ against the NDK toolchain (aarch64)
        run: |
          set -eu
          cmake -S runtime -B build/android-arm64 -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="${{ steps.ndk.outputs.ndk-path }}/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-29 \
            -DCMAKE_SYSTEM_PROCESSOR=aarch64 \
            -DCMAKE_BUILD_TYPE=Release \
            -DAURORA_DAWN_PROVIDER=package

      - name: Build runtime/ (aarch64)
        run: cmake --build build/android-arm64 --config Release

      - name: Upload built runtime artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: wiicompiled-android-arm64
          path: |
            build/android-arm64/*.so
            build/android-arm64/**/*.so
          if-no-files-found: warn

      - name: Upload configure/build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-configure-logs
          path: |
            build/android-arm64/CMakeFiles/CMakeError.log
            build/android-arm64/CMakeFiles/CMakeOutput.log

  abi-proof-ndk:
    name: statefree_regcall_sret_proof (aarch64, NDK, no game data)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Android NDK
        id: ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27c
          local-cache: false

      # This fixture (translator/tests/fixtures/statefree_regcall_sret_proof.cpp) is
      # synthetic ABI-stress-test C++ from the translator's own test suite - no game
      # code or assets involved. __declspec(noinline) is MSVC/clang-cl-only, so a
      # portable shim header is injected ahead of it for the NDK's plain Clang target,
      # rather than editing the committed fixture.
      - name: Install qemu-user for running the cross-compiled aarch64 binary
        run: sudo apt-get update && sudo apt-get install -y qemu-user

      - name: Compile the ABI proof fixture for aarch64-linux-android
        run: |
          set -eu
          clang="${{ steps.ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android29-clang++"
          cat > declspec_shim.h <<'EOF'
          #pragma once
          #if !defined(_WIN64)
          #define __declspec(x) __attribute__((x))
          #endif
          EOF
          "$clang" -std=c++17 -O2 -static \
            -include declspec_shim.h \
            -o abi_proof \
            translator/tests/fixtures/statefree_regcall_sret_proof.cpp
          file abi_proof

      - name: Run the ABI proof fixture under qemu-aarch64
        run: qemu-aarch64 ./abi_proof
