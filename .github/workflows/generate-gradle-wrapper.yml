name: (one-off) Generate Gradle wrapper

on:
  workflow_dispatch:

jobs:
  generate-wrapper:
    name: Generate gradlew + wrapper jar/properties
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Generate wrapper
        run: gradle wrapper --gradle-version 8.7

      - name: Show what was generated
        run: |
          ls -la gradlew gradlew.bat gradle/wrapper/
          cat gradle/wrapper/gradle-wrapper.properties

      - name: Upload wrapper files as artifact
        uses: actions/upload-artifact@v4
        with:
          name: gradle-wrapper-files
          path: |
            gradlew
            gradlew.bat
            gradle/wrapper/gradle-wrapper.jar
            gradle/wrapper/gradle-wrapper.properties
          if-no-files-found: error
