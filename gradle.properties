# Required for com.google.android.material:material and androidx.appcompat/
# androidx.activity, added to support the on-device ISO staging UI
# (ChooserActivity's Material 3 redesign - see IsoLibrary.java). This project
# did not previously depend on any AndroidX library, so this key was never
# set before.
android.useAndroidX=true

# No android.enableJetifier: Jetifier rewrites old com.android.support
# references in *dependencies* to their androidx equivalents. Nothing in
# this project's dependency graph uses the old support library (SDL3 is
# vendored natively, not as a Java support-library dependency - see
# app/build.gradle's dependencies {} comment), so there's nothing for
# Jetifier to rewrite, and leaving it off keeps builds slightly faster.

# Existing Gradle daemon/JVM tuning, if any, should be added here too -
# this file did not exist in the project before this change.
