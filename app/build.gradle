plugins {
    id 'com.android.application'
}

android {
    namespace 'org.patchzyy.wiicompiled'
    compileSdk 34

    // Must match the ndk-version set in .github/workflows/android.yml's
    // nttld/setup-ndk step. Without this, AGP silently installs and uses its
    // own default NDK (seen as 26.1.10909125 in CI logs) instead of r27c -
    // the version the Crypto++ cpu.cpp and memfd_create/android-30 fixes
    // were actually validated against.
    ndkVersion "27.2.12479018"

    defaultConfig {
        applicationId "org.patchzyy.wiicompiled"
        // minSdk 30 matches ANDROID_PLATFORM=android-30 in runtime/CMakeLists.txt
        // (required for memfd_create - see guest_flat_memory.cpp).
        minSdk 30
        targetSdk 34
        versionCode 1
        versionName "0.1.0"

        ndk {
            // Only aarch64 has been validated by CI (see .github/workflows/android.yml,
            // gradle-build job). Do not widen this until armeabi-v7a/x86_64 have their
            // own validated builds - the Crypto++ CPU-detection fix and the -mcpu=native
            // baseline flag were verified for arm64-v8a specifically.
            abiFilters.add("arm64-v8a")
        }

        externalNativeBuild {
            cmake {
                // WiiCompiled/RetroRewind targets, ANDROID_PLATFORM, etc. are all owned by
                // runtime/CMakeLists.txt itself (same file the CI workflow configures) -
                // nothing is duplicated here.
                //
                // AURORA_DAWN_PROVIDER=vendor forces aurora-main/cmake/AuroraDawnProvider.cmake
                // to build Dawn from source instead of fetching a prebuilt package. This is
                // required on Android: the "package" provider only has prebuilt archives for
                // windows/linux/darwin desktop targets (see _has_package's platform check in
                // AuroraDawnProvider.cmake), so it was previously linking a desktop-built Dawn
                // binary, which built and ran but used the wrong native graphics backend at
                // runtime - this is what caused the on-device GetGpuPixelFormat/
                // GraphicBufferAllocator/Gralloc4 "Unknown Format"/"failed to allocate" failures
                // after SDL_main started successfully.
                //
                // AURORA_DAWN_VERSION must be pinned explicitly alongside PROVIDER=vendor.
                // AuroraDawnProvider.cmake's vendor path fetches
                // https://github.com/google/dawn/archive/refs/tags/${AURORA_DAWN_VERSION}.tar.gz
                // directly, reusing the SAME variable the "package" provider uses for its
                // encounter/dawn-build release tag - the two providers are not independently
                // versioned. Whatever AURORA_DAWN_VERSION defaults to elsewhere in this project
                // was set for the "package" tag scheme and is not guaranteed to exist as a real
                // google/dawn release tag (v20260603.191052 didn't - 404). v20260819.212523 is
                // confirmed to exist as a real google/dawn release as of 2026-08-20; if vendor
                // builds start failing again with a download 404, check
                // https://github.com/google/dawn/releases for a current tag and bump this.
                //
                // CMAKE_BUILD_TYPE=Release is forced here because runtime/CMakeLists.txt
                // hard-errors on any other build type ("WiiCompiled only supports Release
                // builds", CMakeLists.txt:14). AGP's assembleDebug variant otherwise passes
                // CMAKE_BUILD_TYPE=Debug to configureCMakeDebug by convention - this
                // override keeps the underlying native build Release regardless of which
                // Gradle build variant (debug/release) triggers it, without touching the
                // shared CMakeLists.txt that the desktop build also uses.
                // PROTOC_EXECUTABLE: Dawn's vendor build (AURORA_DAWN_PROVIDER=vendor) runs
                // protoc as a build-time code generator, which must run on the CI host
                // (x86_64) even though the rest of Dawn is cross-compiled for arm64 Android.
                // dawn-src/third_party/protobuf.cmake hard-errors on configure without this
                // when cross-compiling. Sourced from the PROTOC_EXECUTABLE env var (set by
                // .github/workflows/android.yml after installing protobuf-compiler) rather
                // than hardcoded, since the path may differ outside CI. Falls back to
                // "protoc" (resolved via PATH) if the env var isn't set, for local builds
                // where protoc is already on PATH.
                // CMAKE_CXX_SCAN_FOR_MODULES=OFF: Dawn's vendor build (dawn-src/src/dawn's
                // dawncpp_module target) uses C++20 modules, which CMake's Ninja generator
                // only supports from Ninja 1.11+ - AGP's SDK-managed Ninja is 1.10.2 and
                // fails outright at CMake Generate ("Ninja generator does not support C++20
                // modules using Ninja version 1.10.2"). Disabling module scanning falls the
                // target back to ordinary non-modular compilation instead of requiring a
                // newer Ninja to be supplied separately.
                // CMAKE_MAKE_PROGRAM: AGP's own SDK-managed Ninja (1.10.2) is too old to
                // build Dawn's dawncpp_module target, which declares C++20 module sources
                // unconditionally - CMake requires Ninja 1.11+ to build any target with
                // modules, and this held true even with CMAKE_CXX_SCAN_FOR_MODULES=OFF.
                // Overrides AGP's bundled Ninja with a modern one installed by
                // .github/workflows/android.yml (NINJA_EXECUTABLE env var). Falls back to
                // "ninja" (resolved via PATH) if unset, for local builds with a
                // sufficiently new Ninja already on PATH.
                def protocExecutable = System.getenv("PROTOC_EXECUTABLE") ?: "protoc"
                def ninjaExecutable = System.getenv("NINJA_EXECUTABLE") ?: "ninja"
                arguments "-DANDROID_PLATFORM=android-30", "-DAURORA_DAWN_PROVIDER=vendor", "-DAURORA_DAWN_VERSION=v20260819.212523", "-DPROTOC_EXECUTABLE=${protocExecutable}", "-DCMAKE_CXX_SCAN_FOR_MODULES=OFF", "-DCMAKE_MAKE_PROGRAM=${ninjaExecutable}", "-DCMAKE_BUILD_TYPE=Release"
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    externalNativeBuild {
        cmake {
            // Points at the existing project root CMakeLists.txt (runtime/), not a
            // separate Android-only build script.
            path "../runtime/CMakeLists.txt"
            // aurora-main's CMakeLists.txt (pulled in via add_subdirectory from
            // runtime/CMakeLists.txt) requires CMake >= 3.25 - AGP's default managed
            // CMake package (3.22.1) is too old and fails at the very first line of
            // aurora-main/CMakeLists.txt with "CMake 3.25 or higher is required."
            // 3.31.5 is a current SDK-distributed package version.
            version "3.31.5"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    // AGP validates that every asset referenced actually exists; wii_bootstrap/,
    // dsp_coef.bin and initial_pipeline_cache.db are staged into
    // app/src/main/assets/ by a Gradle task (see copyGameAssets below) rather than
    // committed twice, since runtime/assets/ already holds the source copies used
    // by the desktop build.
    //
    // jniLibs.srcDirs is added for a completely different reason: nodtool and
    // Translator.Cli's native launcher + runtime .so files (libhostfxr.so,
    // libhostpolicy.so, libcoreclr.so, etc.) CANNOT be executed or dlopen()'d
    // from assets-derived app-private storage on Android 10+ - confirmed via a
    // real on-device test that hit SELinux's W^X enforcement directly
    // ("avc: denied { execute_no_trans } ... scontext=u:r:untrusted_app").
    // Files under ApplicationInfo.nativeLibraryDir get a different SELinux
    // label and are exempt - this is Android's own sanctioned mechanism for
    // shipping native code, not a workaround. See bundleNodtool/
    // bundleTranslatorCli below and TranslatorRunner.java, which invokes
    // everything via nativeLibraryDir instead of a path under getFilesDir().
    sourceSets {
        main {
            assets.srcDirs += "src/main/assets"
            jniLibs.srcDirs += "src/main/jniLibs"
        }
    }
}

// Stage the same asset files the desktop POST_BUILD copy_directory/copy_if_different
// steps in runtime/cmake/PublicProducts.cmake already use, so Android and desktop
// builds draw from one source of truth (runtime/assets/, generated/) instead of a
// second hand-maintained copy living under app/src/main/assets/.
tasks.register("copyGameAssets", Copy) {
    from("${projectDir}/../runtime/assets/wii") {
        into "wii_bootstrap"
    }
    from "${projectDir}/../runtime/assets/dsp/dsp_coef.bin"
    from "${projectDir}/../runtime/assets/pipeline/initial_pipeline_cache.db"
    into "${projectDir}/src/main/assets/game"
}

// MAP.txt (Translator.Cli's translation.function_map input, see
// TranslatorRunner.java) is project-specific config, not a build output -
// bundled as its own asset tree rather than folded into copyGameAssets'
// "game/" destination, since it's read by the on-device translation
// pipeline rather than by the compiled runtime itself.
tasks.register("copyTranslatorProjectAssets", Copy) {
    from "${projectDir}/../projects/mkwii/MAP.txt"
    into "${projectDir}/src/main/assets/translator_project"
}

// Stage 2 of the on-device translation pipeline (see AGENTS - on-device
// translation pipeline / IsoLibrary.java, TranslatorRunner.java): publishes
// Translator.Cli as a self-contained linux-bionic-arm64 binary.
//
// Built fresh from source on every build rather than a committed binary
// artifact, so it can never silently drift out of sync with translator/
// source changes.
//
// Deliberately a plain self-contained (JIT, multi-file) publish, NOT
// NativeAOT and NOT PublishSingleFile: linux-bionic-arm64 has multiple
// documented bug reports specifically for NativeAOT and for
// --self-contained + single-file combined (see dotnet/runtime#92272,
// #101727, #87340, dotnet/sdk#35518). Confirmed working in CI (see
// .github/workflows/android.yml's translator-bionic-publish job).
//
// IMPORTANT: not just the apphost - EVERY .so file in the self-contained
// publish output (libhostfxr.so, libhostpolicy.so, libcoreclr.so,
// libclrjit.so, and others) is moved to jniLibs/arm64-v8a/, not just
// Translator.Cli's own entry executable. The apphost doesn't exec() a
// separate process for these - it dlopen()s them in-process as part of
// the hostfxr -> hostpolicy -> coreclr chain (confirmed via .NET's own
// host-components design docs) - but dlopen() on a file staged under
// assets-derived app-private storage hits the exact same SELinux W^X
// "execute" denial as execve() does, just one level deeper into startup
// instead of failing immediately. Renaming every .so with a "lib" prefix
// (already true for .NET's own naming - libhostfxr.so etc. ship prefixed
// already, only the apphost itself needed renaming) and staging all of
// them under jniLibs/arm64-v8a/ is required for the whole chain to work,
// not just the first exec.
//
// Only the managed .dll files (pure IL bytecode, opened and read by the
// CoreCLR runtime's own file I/O once it's already running - never
// dlopen()'d or execve()'d by anything) stay under assets/translator/,
// where they're just data files W^X has no opinion about.
tasks.register("bundleTranslatorCli", Exec) {
    def translatorProject = "${projectDir}/../translator/src/Translator.Cli/Translator.Cli.csproj"
    def publishDir = "${projectDir}/build/translator-publish"
    def assetsDir = "${projectDir}/src/main/assets/translator"
    def jniLibsDir = "${projectDir}/src/main/jniLibs/arm64-v8a"

    inputs.file(translatorProject)
    inputs.dir("${projectDir}/../translator/src")
    outputs.dir(assetsDir)
    outputs.dir(jniLibsDir)

    commandLine "bash", "-c", """
        set -eu
        rm -rf "${publishDir}"
        mkdir -p "${publishDir}" "${assetsDir}" "${jniLibsDir}"
        dotnet publish "${translatorProject}" \\
            -c Release \\
            -r linux-bionic-arm64 \\
            --self-contained true \\
            -o "${publishDir}"
        test -f "${publishDir}/Translator.Cli"

        # Move every real ELF .so in the publish output to jniLibs - these
        # are dlopen()'d by the apphost/hostfxr chain at runtime and must
        # not be left under assets/ (see comment above). find -exec file
        # rather than a bare *.so glob, since a couple of .NET's host
        # libraries are occasionally shipped without a "lib" prefix or
        # with unusual naming depending on publish shape - checking actual
        # ELF magic bytes is more robust than trusting the filename alone.
        find "${publishDir}" -maxdepth 1 -type f -name '*.so' -print0 |
        while IFS= read -r -d '' so; do
            cp "\$so" "${jniLibsDir}/"
        done

        # The apphost itself has no .so extension or "lib" prefix by
        # default (dotnet publish names it after the project, "Translator.Cli"
        # on non-Windows) - rename it to fit AGP's jniLibs naming
        # convention (lib*.so) so PackageManager recognizes and extracts
        # it into nativeLibraryDir at install time.
        cp "${publishDir}/Translator.Cli" "${jniLibsDir}/libtranslator.so"
        chmod +x "${jniLibsDir}"/*.so

        # Everything else (managed .dll files, .json config, etc.) stays
        # under assets/ as plain data files.
        rm -rf "${assetsDir}"
        mkdir -p "${assetsDir}"
        cp -r "${publishDir}"/* "${assetsDir}/"
        rm -f "${assetsDir}/Translator.Cli" "${assetsDir}"/*.so
    """
}

// Disc-extraction stage of the on-device translation pipeline, upstream of
// bundleTranslatorCli: stages nodtool (github.com/encounter/nod,
// MIT/Apache-2.0), the same tool this project's desktop build already
// uses (see Launcher/WiiCompiled.Setup.Common/NodToolProvider.cs).
//
// Clones nod's source and cross-compiles via cargo-ndk rather than a
// single publish command (unlike bundleTranslatorCli above), so this needs
// a small inline shell script rather than a bare Exec commandLine. Cached
// under the Gradle project's build directory - re-runs only when the
// pinned NODTOOL_VERSION below changes or the cache is cleared, since a
// git clone + full Rust release build is far slower than dotnet publish's
// incremental behavior.
//
// KEEP IN SYNC: the version below must match
// Launcher/WiiCompiled.Setup.Common/NodToolProvider.cs's Version constant -
// see .github/workflows/android.yml's nodtool-android-build job, which
// verifies this same pinned version cross-compiles successfully.
//
// Requires ANDROID_NDK_HOME to be set and cargo-ndk + the
// aarch64-linux-android Rust target to already be installed on the build
// machine - confirmed available on CI (see android.yml), but NOT currently
// auto-installed by this task itself.
//
// IMPORTANT: placed under jniLibs/arm64-v8a/ as libnodtool.so, NOT
// assets/ - same W^X SELinux workaround as bundleTranslatorCli's apphost
// above. nodtool is a single self-contained binary with no separate data
// files to stage, unlike Translator.Cli.
tasks.register("bundleNodtool", Exec) {
    def nodtoolVersion = "v2.0.0-alpha.10"
    def nodSourceCache = "${projectDir}/build/nodtool-src-cache"
    def jniLibsDir = "${projectDir}/src/main/jniLibs/arm64-v8a"
    def ndkHome = System.getenv("ANDROID_NDK_HOME") ?: (android.ndkDirectory?.absolutePath ?: "")

    outputs.file("${jniLibsDir}/libnodtool.so")

    environment "ANDROID_NDK_HOME", ndkHome

    commandLine "bash", "-c", """
        set -eu
        if [ -z "${ndkHome}" ]; then
            echo "ANDROID_NDK_HOME is not set and android.ndkDirectory could not resolve one - cannot cross-compile nodtool." >&2
            exit 1
        fi
        mkdir -p "${jniLibsDir}"
        marker="${jniLibsDir}/.nodtool-version"
        if [ -f "\$marker" ] && [ "\$(cat "\$marker")" = "${nodtoolVersion}" ] && [ -x "${jniLibsDir}/libnodtool.so" ]; then
            echo "nodtool ${nodtoolVersion} already built and staged, skipping."
            exit 0
        fi
        if [ ! -d "${nodSourceCache}/.git" ]; then
            rm -rf "${nodSourceCache}"
            git clone --depth 1 --branch ${nodtoolVersion} https://github.com/encounter/nod.git "${nodSourceCache}"
        fi
        cd "${nodSourceCache}"
        cargo ndk -t arm64-v8a build --release -p nodtool
        cp "${nodSourceCache}/target/aarch64-linux-android/release/nodtool" "${jniLibsDir}/libnodtool.so"
        chmod +x "${jniLibsDir}/libnodtool.so"
        echo "${nodtoolVersion}" > "\$marker"
    """
}

tasks.named("preBuild").configure {
    dependsOn "copyGameAssets"
    dependsOn "copyTranslatorProjectAssets"
    dependsOn "bundleTranslatorCli"
    dependsOn "bundleNodtool"
}

// preBuild.dependsOn above is NOT sufficient on its own: AGP's own
// mergeDebugJniLibFolders/mergeReleaseJniLibFolders task (the one that
// actually packages jniLibs/ content into the APK) resolves its input file
// list independently, and can run - or have its inputs already resolved -
// before bundleNodtool/bundleTranslatorCli finish writing into
// src/main/jniLibs/, silently packaging an empty directory while the build
// still reports overall success. Confirmed via a real device test: the
// build succeeded, but lib/arm64/ in the installed APK was empty.
//
// This is a known, previously-reported class of bug for exactly this
// pattern (see mozilla/rust-android-gradle#85, a Rust-cross-compile-into-
// jniLibs plugin that hit the identical race) - the confirmed fix there,
// applied the same way here, is to make the merge task itself explicitly
// depend on the tasks that populate jniLibs, rather than relying on
// preBuild ordering alone.
tasks.whenTaskAdded { task ->
    if (task.name == "mergeDebugJniLibFolders" || task.name == "mergeReleaseJniLibFolders") {
        task.dependsOn "bundleNodtool"
        task.dependsOn "bundleTranslatorCli"
    }
}

dependencies {
    // SDL3 is already vendored/fetched by aurora-main for the native side; no
    // separate Java-side SDL dependency is needed beyond the SDLActivity source
    // (added directly under src/main/java, see org/libsdl/app/).

    // Added for ChooserActivity's Material 3 ISO-staging UI (see IsoLibrary.java).
    // This project had no AndroidX dependency before this - see the new
    // gradle.properties android.useAndroidX=true.
    //
    // 1.12.0 is the latest confirmed STABLE release as of this writing; Material
    // Components for Android (the Views library used here, as opposed to Compose)
    // entered maintenance mode following Google's 2026 Compose-first announcement,
    // so newer 1.13.0/1.14.0 entries seen on Maven are snapshot/alpha builds, not
    // stable releases - pin to 1.12.0 rather than chase those.
    implementation 'com.google.android.material:material:1.12.0'

    // ChooserActivity extends AppCompatActivity (needed for DynamicColors /
    // Theme.Material3.DayNight support) rather than plain Activity.
    implementation 'androidx.appcompat:appcompat:1.7.0'

    // registerForActivityResult(ActivityResultContracts.OpenDocument(), ...) for
    // the SAF disc-image picker - this API lives in androidx.activity, not appcompat.
    implementation 'androidx.activity:activity:1.9.3'
}
